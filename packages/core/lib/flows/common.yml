# Shared flow states imported by concrete payment-method flows.
#
# This file intentionally has no top-level `id`; it is a state fragment meant
# to be merged into a root flow definition via `imports:`.

states:
  makerConfirmed:
    nip69: in-progress
    description: Maker confirmed payment. Settling hold invoice, paying out the taker.
    do: [settle_offer_funds]
    transitions:
      - on: auto
        do: []
        to: settled

  settled:
    nip69: in-progress
    description: Hold invoice settled. Proceeding into the payout attempt.
    transitions:
      - on: auto
        do: []
        to: payingTaker

  payingTaker:
    nip69: in-progress
    description: Sending the Lightning payout to the taker.
    do: [send_payment]
    transitions:
      - on: auto
        do: []
        to: takerPaid
        on_fail: takerPaymentFailed

  takerPaid:
    nip69: success
    description: Taker paid. Trade complete.
    terminal: true

  takerPaymentFailed:
    nip69: in-progress
    description: Payout failed. Awaiting a fresh invoice / retry.
    transitions:
      - on: update_taker_invoice
        by: taker
        do: [update_taker_invoice]
        to: payingTaker
      - on: retry_taker_payment
        by: taker
        do: []
        to: payingTaker

  cancelled:
    nip69: canceled
    description: Offer cancelled.
    terminal: true

  cancelling:
    nip69: in-progress
    description: Cancellation committed. Returning the hold invoice to the maker.
    do: [cancel_hold_invoice]
    transitions:
      - on: auto
        to: cancelled

  securingDispute:
    nip69: dispute
    description: Dispute committed. Securing the hold invoice at the coordinator.
    do: [settle_offer_funds]
    transitions:
      - on: auto
        to: dispute

  dispute:
    nip69: dispute
    description: >
      Formal dispute with the hold invoice secured by the coordinator. The
      coordinator rules: refund the maker or pay the taker.
    transitions:
      - on: resolve_dispute_refund_maker
        by: coordinator
        do: []
        to: refundingMaker
        reason: Coordinator ruled for the maker; awaiting the maker's exact-amount payout invoice.
      - on: resolve_dispute_pay_taker
        by: coordinator
        do: []
        to: payingTaker
        reason: Coordinator ruled for the taker.

  refundingMaker:
    nip69: dispute
    description: Maker refund ruling committed. Awaiting a valid exact-amount payout invoice.
    transitions:
      - on: submit_maker_refund_invoice
        by: maker
        do: [update_maker_refund_invoice]
        to: payingMaker
        reason: Maker supplied the exact-amount payout invoice for the committed refund ruling.

  payingMaker:
    # Keep the case in the coordinator's public dispute queue until the refund
    # succeeds. The raw state still differentiates the active payout attempt.
    nip69: dispute
    description: Refund decision committed. Paying the maker's persisted invoice.
    do: [refund_maker]
    transitions:
      - on: auto
        to: cancelled
        on_fail: refundingMaker
