# Bitblik / TWINT offer state machine (Swiss TWINT variant)
# Transitions are enforced server-side. Each state lists its valid transitions.
# Trigger types:
#   user_action  — initiated explicitly by maker, taker, or coordinator
#   timeout      — fired by server timer on state entry (seconds)
#   auto         — fires immediately on state entry (no external trigger needed)
#
# Initial state: funded
#   The server creates the offer record and enters this state as soon as it
#   detects a settled hold invoice on the Lightning backend. Everything prior
#   (maker creating an offer, obtaining a TWINT code from the merchant, paying
#   the invoice) is client-side only.

states:

  # ─── offer lifecycle ────────────────────────────────────────────────

  funded:
    initial: true
    description: >
      Hold invoice confirmed on the LN backend. The offer carries the maker's
      TWINT code (obtained from the merchant). Offer is live and open for takers.
      Server sends new offer notifications on entry.
    on_entry: send_offer_notifications
    transitions:
      - trigger: user_action
        event: maker_cancels
        target: cancelled
        actor: maker
      - trigger: user_action
        event: taker_reserves
        target: reserved
        actor: taker
      - trigger: timeout
        duration_seconds: 300  # 5 min
        target: expired
        reason: No taker reserved within 5 minutes

  reserved:
    description: >
      A taker has reserved the offer slot. The server reveals the maker's TWINT
      code to the taker so they can pay it from their app.
    on_entry: send_twint_code_to_taker
    transitions:
      - trigger: user_action
        event: taker_marks_charged
        target: twint_charged
        actor: taker
        note: Taker paid the TWINT code in their app and marked it charged
      - trigger: user_action
        event: taker_cancels
        target: funded
        actor: taker
        note: Re-opens the offer for other takers (returns to funded/available state)
      - trigger: timeout
        duration_seconds: 300   # 5 min — matches TWINT code lifespan
        target: expired_twint
        reason: Taker did not pay the TWINT code within its 5-minute lifespan

  twint_charged:
    description: >
      Taker reports having paid the TWINT code. Server notifies the maker, who
      must verify receipt against the merchant and render a verdict.
    on_entry: notify_maker_of_charge
    transitions:
      - trigger: user_action
        event: maker_confirms_payment
        target: maker_confirmed
        actor: maker
        note: Maker confirms the TWINT payment was received
      - trigger: user_action
        event: maker_marks_invalid
        target: conflict
        actor: maker
        note: Maker reports the payment was not received / invalid
      - trigger: timeout
        duration_seconds: 3600  # 60 min
        target: conflict
        reason: Maker silent for 60 minutes; escalate to conflict

  maker_confirmed:
    description: Maker confirmed payment received. Settling hold invoice and paying out taker.
    on_entry: settle_hold_invoice
    transitions:
      - trigger: auto
        target: settled

  # ─── settlement & payout ────────────────────────────────────────────

  settled:
    description: Hold invoice settled. Requesting taker's Lightning invoice for payout.
    on_entry: request_taker_invoice
    transitions:
      - trigger: auto
        target: paying_taker
        action: send_payment

  paying_taker:
    description: Server is sending the Lightning payment to the taker.
    transitions:
      - trigger: auto
        event: payment_success
        target: taker_paid
      - trigger: auto
        event: payment_failed
        target: taker_payment_failed

  taker_paid:
    description: Taker has been paid. Trade complete.
    terminal: true

  taker_payment_failed:
    description: Payment to taker failed. Waiting for taker to provide a new invoice.
    transitions:
      - trigger: user_action
        event: taker_provides_new_invoice
        target: paying_taker
        actor: taker

  # ─── cancellation terminals ─────────────────────────────────────────

  cancelled:
    description: Offer cancelled by maker while still in funded (open) state.
    terminal: true
    on_entry: cancel_hold_invoice

  expired:
    description: Offer expired — no taker reserved within the allotted time.
    terminal: true
    on_entry: cancel_hold_invoice

  # ─── TWINT failure states ────────────────────────────────────────────

  expired_twint:
    description: >
      The taker's TWINT payment window expired (5-min timeout on reserved).
      The taker may re-take; re-entering `reserved` mints a fresh code.
    transitions:
      - trigger: user_action
        event: taker_retakes
        target: reserved
        actor: taker
      - trigger: timeout
        duration_seconds: 3600  # 60 min
        target: expired
        reason: No re-take within 60 minutes

  # ─── conflict & dispute ──────────────────────────────────────────────

  conflict:
    description: >
      Maker reported the TWINT payment as not received/invalid (or timed out).
      Maker may still confirm it as received, or open a formal dispute requiring
      coordinator intervention. NOTE: in TWINT the taker holds definitive proof
      of payment (their app's TWINT confirmation), so consider also allowing
      `taker_opens_dispute` here to protect a taker who genuinely paid against a
      maker who stalls — see the dispute state.
    transitions:
      - trigger: user_action
        event: maker_confirms_payment
        target: maker_confirmed
        actor: maker
        note: Maker reconsiders and confirms the payment was received
      - trigger: user_action
        event: maker_opens_dispute
        target: dispute
        actor: maker
      - trigger: timeout
        duration_seconds: 3600  # 60 min
        target: expired
        reason: No action in 60 minutes; cancel

  dispute:
    description: >
      Formal dispute opened. Taker must provide evidence of the TWINT payment
      (transaction reference / app confirmation). Coordinator reviews and
      resolves. State stays here until coordinator acts; track evidence receipt
      as a sub-field (e.g. evidence_received: true).
    transitions:
      - trigger: user_action
        event: taker_provides_evidence
        target: dispute
        actor: taker
        note: Evidence acknowledged; state remains dispute until coordinator resolves
      - trigger: user_action
        event: coordinator_resolves_for_maker
        target: maker_confirmed
        actor: coordinator
        action: settle_hold_invoice
      - trigger: user_action
        event: coordinator_resolves_for_taker
        target: refund_maker
        actor: coordinator
        action: cancel_hold_invoice
      - trigger: timeout
        duration_seconds: 172800  # 48 hours
        target: refund_maker
        reason: Dispute not resolved in 48 hours; refund maker

  refund_maker:
    description: Dispute timed out or resolved in taker's favour. Hold invoice cancelled/refunded.
    terminal: true
    on_entry: cancel_hold_invoice