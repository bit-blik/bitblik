# Bitblik offer state machine
# Transitions are enforced server-side. Each state lists its valid transitions.
# Trigger types:
#   user_action  — initiated explicitly by maker or taker
#   timeout      — fired by server timer on state entry (seconds)
#   auto         — fires immediately on state entry (no external trigger needed)
#
# Initial state: funded
#   The server creates the offer record and enters this state as soon as it
#   detects a settled hold invoice on the Lightning backend. Everything prior
#   (maker creating an offer, paying the invoice) is client-side only.

states:

  # ─── offer lifecycle ────────────────────────────────────────────────

  funded:
    initial: true
    description: >
      Hold invoice confirmed on the LN backend. Offer is live and open for takers.
      Server sends new offer notifications on entry.
    on_entry: send_offer_notifications
    transitions:
      - trigger: user_action
        event: maker_cancels
        target: cancelled
        actor: maker
      - trigger: user_action
        event: taker_reserves
        target: reserved
        actor: taker
      - trigger: timeout
        duration_seconds: 600  # 10 min
        target: expired
        reason: No taker reserved within 10 minutes

  reserved:
    description: A taker has reserved the offer slot.
    transitions:
      - trigger: user_action
        event: taker_enters_blik
        target: blik_received
        actor: taker
      - trigger: user_action
        event: taker_cancels
        target: funded
        actor: taker
        note: Re-opens the offer for other takers (returns to funded/available state)
      - trigger: timeout
        duration_seconds: 120   # 2 min
        target: expired_blik
        reason: Taker did not enter BLIK code in time

  blik_received:
    description: Taker has submitted a BLIK code. Server forwards it to the maker.
    on_entry: send_blik_to_maker
    transitions:
      - trigger: user_action
        event: taker_cancels
        target: invalid_blik
        actor: taker
      - trigger: timeout
        duration_seconds: 120   # 2 min
        target: expired_sent_blik
        reason: Maker did not respond within 2 minutes

  maker_confirmed:
    description: Maker confirmed good BLIK. Settling hold invoice and paying out taker.
    on_entry: settle_hold_invoice
    transitions:
      - trigger: auto
        target: settled

  # ─── settlement & payout ────────────────────────────────────────────

  settled:
    description: Hold invoice settled. Requesting taker's Lightning invoice for payout.
    on_entry: request_taker_invoice
    transitions:
      - trigger: auto
        target: paying_taker
        action: send_payment

  paying_taker:
    description: Server is sending the Lightning payment to the taker.
    transitions:
      - trigger: auto
        event: payment_success
        target: taker_paid
      - trigger: auto
        event: payment_failed
        target: taker_payment_failed

  taker_paid:
    description: Taker has been paid. Trade complete.
    terminal: true

  taker_payment_failed:
    description: Payment to taker failed. Waiting for taker to provide a new invoice.
    transitions:
      - trigger: user_action
        event: taker_provides_new_invoice
        target: paying_taker
        actor: taker

  # ─── cancellation terminals ─────────────────────────────────────────

  cancelled:
    description: Offer cancelled by maker while still in funded (open) state.
    terminal: true
    on_entry: cancel_hold_invoice

  expired:
    description: Offer expired — no taker reserved within the allotted time.
    terminal: true
    on_entry: cancel_hold_invoice

  # ─── BLIK failure states ─────────────────────────────────────────────

  invalid_blik:
    description: Taker cancelled mid-flow. Taker may re-take the offer.
    transitions:
      - trigger: user_action
        event: taker_retakes
        target: reserved
        actor: taker
      - trigger: timeout
        duration_seconds: 3600  # 60 min
        target: expired
        reason: No re-take within 60 minutes

  expired_blik:
    description: Taker's BLIK submission window expired (2 min timeout on reserved).
    transitions:
      - trigger: user_action
        event: taker_retakes
        target: reserved
        actor: taker
      - trigger: timeout
        duration_seconds: 3600  # 60 min
        target: expired
        reason: No re-take within 60 minutes

  expired_sent_blik:
    description: >
      Maker did not respond to the forwarded BLIK within 2 minutes.
      Taker must confirm whether the BLIK was actually charged.
    transitions:
      - trigger: user_action
        event: taker_blik_charged
        target: taker_charged
        actor: taker
      - trigger: timeout
        duration_seconds: 3600  # 60 min
        target: expired
        reason: No action within 60 minutes

  taker_charged:
    description: BLIK was charged from taker but maker has not confirmed. Awaiting maker verdict.
    transitions:
      - trigger: user_action
        event: maker_good_blik
        target: maker_confirmed
        actor: maker
      - trigger: user_action
        event: maker_bad_blik
        target: conflict
        actor: maker
      - trigger: timeout
        duration_seconds: 3600  # 60 min
        target: conflict
        reason: Maker silent for 60 minutes; escalate to conflict

  # ─── conflict & dispute ──────────────────────────────────────────────

  conflict:
    description: >
      Maker reported a bad BLIK (or timed out). Maker may still confirm as good,
      or open a formal dispute requiring coordinator intervention.
    transitions:
      - trigger: user_action
        event: maker_good_blik
        target: maker_confirmed
        actor: maker
        note: Maker reconsiders and confirms BLIK was valid
      - trigger: user_action
        event: maker_opens_dispute
        target: dispute
        actor: maker
      - trigger: timeout
        duration_seconds: 3600  # 60 min
        target: expired
        reason: No action in 60 minutes; cancel

  dispute:
    description: >
      Formal dispute opened. Taker must provide evidence of BLIK payment.
      Coordinator reviews and resolves. State stays here until coordinator acts;
      track evidence receipt as a sub-field (e.g. evidence_received: true).
    transitions:
      - trigger: user_action
        event: taker_provides_evidence
        target: dispute
        actor: taker
        note: Evidence acknowledged; state remains dispute until coordinator resolves
      - trigger: user_action
        event: coordinator_resolves_for_maker
        target: maker_confirmed
        actor: coordinator
        action: settle_hold_invoice
      - trigger: user_action
        event: coordinator_resolves_for_taker
        target: refund_maker
        actor: coordinator
        action: cancel_hold_invoice
      - trigger: timeout
        duration_seconds: 172800  # 48 hours
        target: refund_maker
        reason: Dispute not resolved in 48 hours; refund maker

  refund_maker:
    description: Dispute timed out or resolved in taker's favour. Hold invoice cancelled/refunded.
    terminal: true
    on_entry: cancel_hold_invoice