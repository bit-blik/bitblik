# Bitblik offer state machine — BLIK (Poland) flow.
#
# This file is the SINGLE SOURCE OF TRUTH for the BLIK flow and is parsed at
# runtime by the FlowEngine (packages/core/lib/src/flow). It is reconciled to be
# FAITHFUL to the historical hardcoded coordinator logic: every state name IS
# the matching `OfferStatus` enum value verbatim (so the raw state stored/
# broadcast equals status.name and legacy clients parse it), and every
# transition reproduces a guard/transition that the hardcoded
# `CoordinatorService` enforced. A golden test asserts this equivalence — do not
# "tidy" transitions here without updating that test and the coordinator.
#
# Trigger types:
#   user_action  — initiated explicitly by maker, taker, or coordinator. Its
#                  `event` IS the RPC method that drives it (e.g. reserve_offer).
#   timeout      — fired by a server timer; `duration_seconds` is the DEFAULT
#                  (several are env-overridable on the coordinator)
#   auto         — fires immediately on state entry (server-internal).
#
# effects / on_entry: ordered effect keywords the generic executor resolves
# against its registry. Pre-commit effects (assign_taker, clear_taker_fields,
# validate_code, resolve_taker_invoice, accept_taker_invoice, stamp_*) shape the
# atomic status write; post-commit effects (settle_hold_invoice,
# cancel_hold_invoice, start_payout, notifications) run after it commits.
#
# Initial state: funded.

id: blik

states:

  # ─── offer lifecycle ────────────────────────────────────────────────

  funded:
    nip69: pending
    initial: true
    description: >
      Hold invoice confirmed. Offer is live and open for takers.
    on_entry: [send_offer_notifications]
    transitions:
      - trigger: user_action
        event: cancel_offer
        actor: maker
        target: cancelled
        effects: [clear_taker_fields]
      - trigger: user_action
        event: reserve_offer
        actor: taker
        target: reserved
        effects: [assign_taker, stamp_reserved_at]
      - trigger: timeout
        duration_seconds: 600   # FUNDED_EXPIRY_SECONDS, default 600
        from_field: created_at  # total offer lifetime, NOT reset by reserve/revert
        target: expired
        effects: [clear_taker_fields]
        reason: No taker reserved in time

  reserved:
    nip69: in-progress
    description: A taker holds the offer slot and must submit a BLIK code.
    transitions:
      - trigger: user_action
        event: submit_blik
        actor: taker
        target: blikReceived
        effects: [assign_taker, validate_code, resolve_taker_invoice, stamp_code_received_at]
      - trigger: user_action
        event: cancel_reservation
        actor: taker
        target: funded
        effects: [assign_taker, clear_taker_fields]
        note: Re-opens the offer for other takers.
      - trigger: timeout
        duration_seconds: 59    # RESERVATION_SECONDS
        target: funded
        effects: [clear_taker_fields]
        reason: >
          Taker did not submit a BLIK code in time; the offer is reverted to
          funded (NOT expired) so it is re-listed for other takers.

  blikReceived:
    nip69: in-progress
    description: >
      Taker submitted a BLIK code. The maker has not yet fetched it.
    transitions:
      - trigger: user_action
        event: get_blik
        actor: maker
        target: blikSentToMaker
        returns: blik_code
        note: >
          Maker pulls the code. Modeled as an explicit state because the
          confirmation-timeout target differs before vs after the pull.
      - trigger: timeout
        duration_seconds: 120   # PaymentSystem.confirmationWindow (BLIK = 2 min)
        target: expiredBlik
        reason: Maker never fetched the BLIK code within the confirmation window.

  blikSentToMaker:
    nip69: in-progress
    description: Maker has the BLIK code and must render a verdict.
    transitions:
      - trigger: user_action
        event: confirm_payment
        actor: maker
        target: makerConfirmed
        effects: [stamp_maker_confirmed_at]
      - trigger: user_action
        event: mark_blik_invalid
        actor: maker
        target: invalidBlik
      - trigger: timeout
        duration_seconds: 120   # confirmation window, measured from code_received_at
        from_field: code_received_at
        target: expiredSentBlik
        reason: >
          Maker did not respond within the confirmation window. The window
          continues from when the taker submitted the code (code_received_at),
          NOT from when the maker fetched it — matching the legacy timer.

  makerConfirmed:
    nip69: in-progress
    description: Maker confirmed good BLIK. Settling hold invoice, paying out taker.
    on_entry: [start_payout]
    transitions:
      - trigger: auto
        target: settled

  # ─── settlement & payout (enum-driven tail; documented here) ────────

  settled:
    nip69: in-progress
    description: Hold invoice settled. Resolving taker invoice for payout.
    on_entry: [request_taker_invoice]
    transitions:
      - trigger: auto
        target: payingTaker
        action: send_payment
      - trigger: auto
        event: payout_setup_failed
        target: takerPaymentFailed
        reason: Missing/unresolvable taker invoice before payment was attempted.

  payingTaker:
    nip69: in-progress
    description: Server is sending the Lightning payment to the taker.
    transitions:
      - trigger: auto
        event: payment_success
        target: takerPaid
      - trigger: auto
        event: payment_failed
        target: takerPaymentFailed

  takerPaid:
    nip69: success
    description: Taker paid. Trade complete.
    terminal: true

  takerPaymentFailed:
    nip69: in-progress
    description: Payout to taker failed. Awaiting a fresh invoice / retry.
    transitions:
      - trigger: user_action
        event: update_taker_invoice
        actor: taker
        target: payingTaker
      - trigger: user_action
        event: retry_taker_payment
        actor: taker
        target: payingTaker

  # ─── cancellation terminals ─────────────────────────────────────────

  cancelled:
    nip69: canceled
    description: Maker cancelled while the offer was still funded (open).
    terminal: true
    on_entry: [cancel_hold_invoice]

  expired:
    nip69: canceled
    description: Offer expired — no taker reserved within the funded window.
    terminal: true
    on_entry: [cancel_hold_invoice]

  # ─── BLIK failure / retake states ────────────────────────────────────

  invalidBlik:
    nip69: in-progress
    description: >
      Maker marked the BLIK invalid before the taker reported a charge. The same
      taker may re-take, cancel, or report that they were in fact charged.
    transitions:
      - trigger: user_action
        event: mark_blik_charged
        actor: taker
        target: conflict
        effects: [assign_taker, accept_taker_invoice, stamp_taker_charged_at]
      - trigger: user_action
        event: reserve_offer
        actor: taker
        target: reserved
        effects: [assign_taker, stamp_reserved_at]
      - trigger: user_action
        event: cancel_reservation
        actor: taker
        target: funded
        effects: [assign_taker, clear_taker_fields]
      - trigger: timeout
        duration_seconds: 3600  # conflict/dispute escalation, 60 min
        target: dispute
        effects: [settle_hold_invoice]
        reason: autoInvalidBlikTimeout — taker silent; settle and escalate.

  expiredBlik:
    nip69: in-progress
    description: >
      The maker never fetched the BLIK code (timeout from `blikReceived`). The
      same taker may re-take or cancel; otherwise the offer is re-listed.
    transitions:
      - trigger: user_action
        event: reserve_offer
        actor: taker
        target: reserved
        effects: [assign_taker, stamp_reserved_at]
      - trigger: user_action
        event: cancel_reservation
        actor: taker
        target: funded
        effects: [assign_taker, clear_taker_fields]
      - trigger: timeout
        duration_seconds: 60    # expiredBlik relist timeout
        target: funded
        effects: [clear_taker_fields]
        reason: Grace period elapsed; re-list the offer as funded.

  expiredSentBlik:
    nip69: in-progress
    description: >
      Maker had the code but did not respond within the confirmation window. The
      maker may still rule, the taker may report a charge or re-take.
    transitions:
      - trigger: user_action
        event: confirm_payment
        actor: maker
        target: makerConfirmed
        effects: [stamp_maker_confirmed_at]
      - trigger: user_action
        event: mark_blik_invalid
        actor: maker
        target: invalidBlik
      - trigger: user_action
        event: mark_blik_charged
        actor: taker
        target: takerCharged
        effects: [assign_taker, accept_taker_invoice, stamp_taker_charged_at]
      - trigger: user_action
        event: reserve_offer
        actor: taker
        target: reserved
        effects: [assign_taker, stamp_reserved_at]
      - trigger: timeout
        duration_seconds: 3600  # dispute escalation, 60 min
        target: dispute
        effects: [settle_hold_invoice]
        reason: autoExpiredSentBlikTimeout — settle and escalate.

  takerCharged:
    nip69: in-progress
    description: >
      Taker reported the BLIK was charged but the maker has not confirmed.
      Awaiting maker verdict; silence resolves in the taker's favour.
    transitions:
      - trigger: user_action
        event: confirm_payment
        actor: maker
        target: makerConfirmed
        effects: [stamp_maker_confirmed_at]
      - trigger: user_action
        event: mark_blik_invalid
        actor: maker
        target: conflict
      - trigger: timeout
        duration_seconds: 1800  # TAKER_CHARGED_AUTO_CONFIRM_SECONDS, default 3600
        target: makerConfirmed
        effects: [stamp_maker_confirmed_at]
        reason: >
          Maker silent; auto-confirm in the taker's favour (settles the hold
          invoice and pays the taker).

  # ─── conflict & dispute ──────────────────────────────────────────────

  conflict:
    nip69: dispute
    description: >
      Maker reported a bad BLIK (or it escalated here). Maker may still confirm,
      or open a formal dispute requiring coordinator intervention.
    transitions:
      - trigger: user_action
        event: confirm_payment
        actor: maker
        target: makerConfirmed
        effects: [stamp_maker_confirmed_at]
        note: Maker reconsiders and confirms the BLIK was valid.
      - trigger: user_action
        event: open_dispute
        actor: maker
        target: dispute
        effects: [settle_hold_invoice]
      - trigger: timeout
        duration_seconds: 3600  # dispute escalation, 60 min
        target: dispute
        effects: [settle_hold_invoice]
        reason: autoConflictTimeout — settle and escalate to dispute.

  dispute:
    nip69: dispute
    description: >
      Formal dispute. The hold invoice has been settled; the coordinator resolves
      out of band (manual / admin). No coordinator-enforced automatic transition
      leaves this state today, so it is treated as terminal by the engine.
    terminal: true
