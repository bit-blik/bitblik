nekoInfo:
  title: Was ist ein Neko?
  description: "Dein Neko ist deine Identität für die Nutzung von ${app}. Er besteht aus einem privaten und einem öffentlichen Schlüssel, um eine kryptografisch sichere Kommunikation mit dem Koordinator zu gewährleisten.\n\nFür mehr Anonymität wird empfohlen, für jedes Angebot einen neuen, frischen Neko zu verwenden.\n\n⚠️ WICHTIG: Dein privater Schlüssel wird nur auf deinem Gerät gespeichert (clientseitig). Es ist äußerst wichtig, deinen privaten Schlüssel zu sichern, da du ohne ihn möglicherweise keine Streitfälle lösen und deine Gelder nicht wiederherstellen kannst."
  backupWarning: "Denke daran, deinen Neko zu sichern"

generateNewKey:
  title: Neu
  description: Bist du sicher, dass du einen neuen Neko generieren möchtest? Dein aktueller geht für immer verloren, wenn du ihn nicht gesichert hast.
  buttons:
    generate: Generieren
  errors:
    activeOffer: Du kannst keinen neuen Neko generieren, während du ein aktives Angebot hast.
    failed: "Neuer Neko konnte nicht generiert werden"
  feedback:
    success: Neuer Neko erfolgreich generiert!
  tooltips:
    generate: Neuen Neko generieren

# =============================================================================
# BACKUP AND RESTORE
# =============================================================================
backup:
  title: Sicherung
  description: Dies ist dein privater Schlüssel. Er sichert die Kommunikation mit dem Koordinator. Gib ihn niemals an Dritte weiter. Sichere ihn an einem sicheren Ort, um Probleme bei Streitfällen zu vermeiden.
  feedback:
    copied: Privater Schlüssel in die Zwischenablage kopiert!
  tooltips:
    backup: Neko sichern

restore:
  title: Wiederherstellen
  labels:
    privateKey: Privater Schlüssel
  buttons:
    restore: Wiederherstellen
  errors:
    invalidKey: Muss eine 64-stellige Hex-Zeichenfolge sein.
    failed: "Wiederherstellung fehlgeschlagen"
  feedback:
    success: Neko erfolgreich wiederhergestellt! Die App wird neu gestartet.
  tooltips:
    restore: Neko wiederherstellen

