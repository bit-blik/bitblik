nekoInfo:
  title: Qu'est-ce qu'un Neko ?
  description: "Votre Neko est votre identité pour utiliser ${app}. Il est composé d'une clé privée et d'une clé publique pour garantir une communication cryptographiquement sécurisée avec le coordinateur.\n\nPour plus d'anonymat, il est recommandé d'utiliser un nouveau Neko pour chaque offre.\n\n⚠️ IMPORTANT : votre clé privée n'est stockée que sur votre appareil (côté client). Il est essentiel de sauvegarder votre clé privée, car en perdre l'accès peut vous empêcher de résoudre des litiges et de récupérer vos fonds."
  backupWarning: "Pensez à sauvegarder votre Neko"

generateNewKey:
  title: Nouveau
  description: Voulez-vous vraiment générer un nouveau Neko ? Votre Neko actuel sera perdu pour toujours si vous ne l'avez pas sauvegardé.
