        proceed: Je suis sûr, continuer
        cancel: Annuler

    disputeConfirmDialog:
      title: Ouvrir un litige ?
      content: "N'ouvrez un litige que si le montant a BEL ET BIEN été débité de votre compte bancaire.\n\nLe coordinateur examinera votre cas manuellement, ce qui prend du temps. Vous devrez fournir une preuve de paiement."
