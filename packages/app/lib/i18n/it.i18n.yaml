nekoInfo:
  title: Cos'è un Neko?
  description: "Il tuo Neko è la tua identità per usare BitBlik. È composto da una chiave privata e pubblica per garantire una comunicazione crittograficamente sicura con il coordinatore.\n\nPer garantire maggiore anonimato, si consiglia di usare un nuovo Neko per ogni offerta.\n\n⚠️ IMPORTANTE: La tua chiave privata è memorizzata solo sul tuo dispositivo (lato client). È fondamentale fare il backup della tua chiave privata, poiché perderla potrebbe impedirti di risolvere dispute e recuperare i tuoi fondi."
  backupWarning: "Ricorda di fare il backup del tuo Neko"

generateNewKey:
