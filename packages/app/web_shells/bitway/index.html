  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
    }

    #splash-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 6vh, 48px);
      padding: 24px;
      box-sizing: border-box;
    }

    #splash {
      display: block;
      line-height: 0;
    }

    #splash img {
      display: block;
      width: clamp(150px, 44vw, 220px);
      height: auto;
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    #splash-branding {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 9999;
      text-align: center;
      max-width: 320px;
    }

    .loader {
      width: clamp(34px, 9vw, 44px);
      height: clamp(34px, 9vw, 44px);
      border-radius: 50%;
      border: 3px solid #d7e3f3;
      border-top-color: #165ec9;
      animation: spin 0.9s linear infinite;
    }

    #loading-message {
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    #loading-subtext {
      font-size: clamp(13px, 3.4vw, 15px);
      color: #64748b;
      max-width: 300px;
      line-height: 1.4;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash-wrap")?.remove();
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    function isFlutterUiMounted() {
      return Boolean(
        document.querySelector("flutter-view") ||
          document.querySelector("flt-glass-pane") ||
          document.querySelector("flt-scene-host") ||
          document.querySelector("canvas.flt-canvas")
      );
    }

    function autoRemoveSplashWhenFlutterStarts() {
      if (isFlutterUiMounted()) {
        removeSplashFromWeb();
        return;
      }

      const observer = new MutationObserver(function () {
        if (isFlutterUiMounted()) {
          observer.disconnect();
          clearInterval(pollId);
          removeSplashFromWeb();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });

      const pollId = setInterval(function () {
        if (isFlutterUiMounted()) {
          observer.disconnect();
          clearInterval(pollId);
          removeSplashFromWeb();
        }
      }, 300);

      setTimeout(function () {
        observer.disconnect();
        clearInterval(pollId);
      }, 120000);
    }

    window.addEventListener("DOMContentLoaded", function () {
      const message = document.getElementById("loading-message");
      const subtext = document.getElementById("loading-subtext");

      autoRemoveSplashWhenFlutterStarts();

      setTimeout(function () {
        if (message) message.textContent = "Still loading...";
        if (subtext) {
          subtext.textContent =
            "Your connection seems slow. Flutter assets are still downloading.";
        }
      }, 7000);

      setTimeout(function () {
        if (message) message.textContent = "Almost there...";
      }, 15000);
    });
  </script>
</head>
<body>
  <div id="splash-wrap">
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

  <div id="splash-branding" role="status" aria-live="polite">
    <div class="loader" aria-hidden="true"></div>
    <div id="loading-message">Loading BitWay...</div>
    <div id="loading-subtext">Only first time it will need to download app resources.</div>
  </div>
  </div>

  <!-- Load runtime configuration for group links -->
  <script src="config.js"></script>

  <script src="flutter_bootstrap.js" async=""></script>
</body></html>
