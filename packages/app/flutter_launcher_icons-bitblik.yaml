# Launcher icons for the `bitblik` flavor.
# Generate with:
#   dart run flutter_launcher_icons -f flutter_launcher_icons-bitblik.yaml
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_foreground_inset: 26
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
