name: bitblik_monorepos
publish_to: none

environment:
  sdk: ^3.11.0

dependency_overrides:
  # NDK PR #823: native WebSocket compression opt-out for the Telegram bot.
  ndk:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/ndk,
      ref: 1b437608ff46b5175a7c6a9e932da3e53bace285
    }
  ndk_flutter:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/ndk_flutter,
      ref: 1311be7913687f6bf4151772c2510f47d1a613a3
    }
  # Keep the SQLite 2 adapter while the coordinator uses Matrix 3.x.
  ndk_drift:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/drift,
      ref: 3416e6332a1690cc302a823ac3efdad144e61de6
    }
  ndk_objectbox:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/objectbox,
      ref: 1311be7913687f6bf4151772c2510f47d1a613a3
    }
workspace:
  - packages/app
  - packages/cli
  - packages/coordinator
  - packages/core
  - packages/telegram_bot
