name: bitblik_monorepos
publish_to: none

environment:
  sdk: ^3.11.0

dependency_overrides:
  # NDK PR #823: native WebSocket compression opt-out for the Telegram bot.
  ndk:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/ndk,
      ref: 1b437608ff46b5175a7c6a9e932da3e53bace285
    }
  ndk_flutter:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/ndk_flutter,
      ref: 73d1e62167e20b05fceaf51e655432fe5931f6a5
    }
  ndk_drift:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/drift,
      ref: 73d1e62167e20b05fceaf51e655432fe5931f6a5
    }
  ndk_objectbox:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/objectbox,
      ref: 73d1e62167e20b05fceaf51e655432fe5931f6a5
    }
workspace:
