name: bitblik_monorepos
publish_to: none

environment:
  sdk: ^3.11.0

dependency_overrides:
  # NIP-82 support plus native WebSocket compression opt-out for long-running
  # services.
  ndk:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/ndk,
      ref: c767c6555d6b0b51724f18e3854562f3798b5c2a
    }
  ndk_flutter:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/ndk_flutter,
      ref: c767c6555d6b0b51724f18e3854562f3798b5c2a
    }
  ndk_drift:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/drift,
      ref: c767c6555d6b0b51724f18e3854562f3798b5c2a
    }
  ndk_objectbox:
    git: {
      url: https://github.com/relaystr/ndk.git,
      path: packages/objectbox,
      ref: c767c6555d6b0b51724f18e3854562f3798b5c2a
    }
workspace:
  - packages/app
  - packages/cli
  - packages/coordinator
  - packages/core
  - packages/telegram_bot
