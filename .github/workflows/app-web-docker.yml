name: App Web Docker build & push

on:
  push:
    paths:
      - 'packages/app/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.dockerignore'
      - '.github/workflows/app-web-docker.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    env:
      REGISTRY: ghcr.io
      IMAGENAME: app-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - flavor: bitblik
            flutter_target: lib/main_bitblik.dart
            build_mode: release
          - flavor: bitway
            flutter_target: lib/main_bitway.dart
            build_mode: release

    steps:
      - uses: actions/checkout@v4
        name: Check out code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGENAME }}
          tags: |
            type=raw,value=${{ matrix.flavor }}-${{ matrix.build_mode }}
            type=raw,value=${{ matrix.flavor }}-${{ matrix.build_mode }}-${{ github.sha }}
            type=ref,event=branch,prefix=${{ matrix.flavor }}-,suffix=-${{ matrix.build_mode }}
            type=semver,pattern={{version}}-${{ matrix.flavor }}-${{ matrix.build_mode }}

      - name: Build and push Web Docker image (${{ matrix.flavor }} / ${{ matrix.build_mode }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_FLAVOR=${{ matrix.flavor }}
            FLUTTER_TARGET=${{ matrix.flutter_target }}
            BUILD_MODE=${{ matrix.build_mode }}
          cache-from: type=gha,scope=${{ matrix.flavor }}-${{ matrix.build_mode }}
          cache-to: type=gha,scope=${{ matrix.flavor }}-${{ matrix.build_mode }},mode=max
