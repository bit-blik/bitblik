name: Coordinator Docker build

on:
  push:
    paths:
      - 'packages/coordinator/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.dockerignore'
      - '.github/workflows/coordinator-build.yml'
  pull_request:
    paths:
      - 'packages/coordinator/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/coordinator-build.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      # Flutter needed only to resolve workspace deps that include Flutter packages
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        working-directory: ./packages/coordinator
        run: dart analyze --no-fatal-warnings

      - name: Run tests
        working-directory: ./packages/coordinator
        run: dart test
        env:
          TERMS_OF_USAGE_NADDR: naddr1dummy_test_value_for_ci

  build:
    needs: test
    # Skip image build/push on pull requests; only test PRs.
    if: github.event_name != 'pull_request'
    env:
      REGISTRY: ghcr.io
      IMAGENAME: coordinator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        name: Check out code

      - name: Extract version from pubspec.yaml
        id: version
        run: echo "APP_VERSION=$(grep 'version:' packages/coordinator/pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGENAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/coordinator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
