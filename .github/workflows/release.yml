name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  # ── 1. Create draft release ────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── 2. CLI cross-platform native binaries ─────────────────────────────────
  build_cli:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_x64
            platform_name: linux-x64
          - os: macos-latest
            target: macos_arm64
            platform_name: macos-arm64
          - os: windows-latest
            target: windows_x64
            platform_name: windows-x64
    defaults:
      run:
        shell: bash
        working-directory: ./packages/cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        if: matrix.target != 'macos_x64'
        uses: dart-lang/setup-dart@v1

      - name: Set up Dart (x86_64 SDK via manual download)
        if: matrix.target == 'macos_x64'
        run: |
          curl -fsSL "https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk/dartsdk-macos-x64-release.zip" -o dart-sdk.zip
          unzip -q dart-sdk.zip
          echo "$PWD/dart-sdk/bin" >> $GITHUB_PATH

      - name: Install Rosetta (macos-x64 on ARM runner)
        if: matrix.target == 'macos_x64'
        run: softwareupdate --install-rosetta --agree-to-license

      # Flutter needed for workspace dep resolution (includes Flutter packages).
      # ARM Flutter on macos_x64 runner is fine — pub resolution is arch-independent.
      - name: Set up Flutter (workspace dep resolution)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: .

      # Two declared executables (bitblik = BLIK market, bitway = MB WAY
      # market). Build each target into its own bundle, then merge bitway's
      # binary into the bitblik bundle — both share the identical lib/ (NDK
      # rust dylib) and reference it via the same relative ../lib rpath, so a
      # single merged bundle ships both binaries for the platform.
      - name: Build CLI (both binaries)
        run: |
          BUILD="dart build cli"
          if [ "${{ matrix.target }}" = "macos_x64" ]; then
            BUILD="arch -x86_64 dart build cli"
          fi
          $BUILD -t bin/bitblik.dart -o build/cli-bitblik
          $BUILD -t bin/bitway.dart -o build/cli-bitway
          # Glob covers the .exe suffix on Windows.
          cp build/cli-bitway/bundle/bin/bitway* build/cli-bitblik/bundle/bin/

      - name: Package CLI bundle (Unix)
        if: matrix.target != 'windows_x64'
        run: |
          tar -czf "build/bitblik-cli-${{ matrix.platform_name }}.tar.gz" \
            -C "build/cli-bitblik/bundle" .

      - name: Package CLI bundle (Windows)
        if: matrix.target == 'windows_x64'
        run: |
          cd "build/cli-bitblik/bundle"
          7z a -tzip "../../bitblik-cli-${{ matrix.platform_name }}.zip" .

      - name: Build Linux DEB package
        if: matrix.target == 'linux_x64'
        run: |
          deb_root="build/deb-root"
          rm -rf "$deb_root"
          mkdir -p "$deb_root/DEBIAN" "$deb_root/usr/lib/bitblik" "$deb_root/usr/bin"
          cp -R "build/cli-bitblik/bundle/." "$deb_root/usr/lib/bitblik/"
          ln -s ../lib/bitblik/bin/bitblik "$deb_root/usr/bin/bitblik"
          ln -s ../lib/bitblik/bin/bitway "$deb_root/usr/bin/bitway"
          pkg_version="$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '[:space:]')"
          cat > "$deb_root/DEBIAN/control" <<EOF
          Package: bitblik
          Version: ${pkg_version}~${{ github.run_number }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: bitblik <noreply@github.com>
          Depends: libc6 (>= 2.27)
          Description: BitBlik command line interface (bitblik + bitway)
          EOF
          dpkg-deb --build "$deb_root" "build/bitblik-cli-linux-x64.deb"

      # softprops uploads files under their on-disk names; missing patterns are
      # skipped (fail_on_unmatched_files defaults to false), so the same step
      # works for every matrix target.
      - name: Upload CLI assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            packages/cli/build/bitblik-cli-${{ matrix.platform_name }}.tar.gz
            packages/cli/build/bitblik-cli-${{ matrix.platform_name }}.zip
            packages/cli/build/bitblik-cli-linux-x64.deb

  # ── 3. Android APK (both flavors: bitblik & bitway) ───────────────────────
  build_android:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: bitblik
            entrypoint: lib/main_bitblik.dart
          - flavor: bitway
            entrypoint: lib/main_bitway.dart
    defaults:
      run:
        working-directory: ./packages/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_SHA256: ${{ secrets.KEYSTORE_SHA256 }}
        run: flutter build apk --split-per-abi --release --flavor ${{ matrix.flavor }} -t ${{ matrix.entrypoint }}

      # Flutter's flavored split-per-abi output location varies between versions
      # (build/app/outputs/flutter-apk vs build/app/outputs/apk/<flavor>/release).
      # Locate each ABI APK and copy it to a stable dir under its final asset
      # name so the upload glob is fixed.
      - name: Locate APKs
        run: |
          set -euo pipefail
          mkdir -p build/release-apks
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$(find build/app/outputs -name "app-${{ matrix.flavor }}-${abi}-release.apk" -print -quit)"
            if [ -z "$src" ]; then
              echo "::error::APK not found for abi=${abi} flavor=${{ matrix.flavor }}"
              find build/app/outputs -name '*.apk' || true
              exit 1
            fi
            cp "$src" "build/release-apks/${{ matrix.flavor }}-app-android-${abi}.apk"
          done

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: packages/app/build/release-apks/*.apk

