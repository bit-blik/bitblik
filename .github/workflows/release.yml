name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  # ── 1. Create draft release ────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Create draft release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── 2. CLI cross-platform native binaries ─────────────────────────────────
  build_cli:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_x64
            platform_name: linux-x64
          - os: macos-latest
            target: macos_arm64
            platform_name: macos-arm64
          - os: windows-latest
            target: windows_x64
            platform_name: windows-x64
    defaults:
      run:
        shell: bash
        working-directory: ./packages/cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        if: matrix.target != 'macos_x64'
        uses: dart-lang/setup-dart@v1

      - name: Set up Dart (x86_64 SDK via manual download)
        if: matrix.target == 'macos_x64'
        run: |
          curl -fsSL "https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk/dartsdk-macos-x64-release.zip" -o dart-sdk.zip
          unzip -q dart-sdk.zip
          echo "$PWD/dart-sdk/bin" >> $GITHUB_PATH

      - name: Install Rosetta (macos-x64 on ARM runner)
        if: matrix.target == 'macos_x64'
        run: softwareupdate --install-rosetta --agree-to-license

      # Flutter needed for workspace dep resolution (includes Flutter packages).
      # ARM Flutter on macos_x64 runner is fine — pub resolution is arch-independent.
      - name: Set up Flutter (workspace dep resolution)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: .

      - name: Build CLI (x64 via Rosetta)
        if: matrix.target == 'macos_x64'
        run: arch -x86_64 dart build cli

      - name: Build CLI
        if: matrix.target != 'macos_x64'
        run: dart build cli

      - name: Package CLI bundle (Unix)
        if: matrix.target != 'windows_x64'
        run: |
          tar -czf "build/bitblik-cli-${{ matrix.platform_name }}.tar.gz" \
            -C "build/cli/${{ matrix.target }}/bundle" .

      - name: Package CLI bundle (Windows)
        if: matrix.target == 'windows_x64'
        run: |
          cd "build/cli/${{ matrix.target }}/bundle"
          7z a -tzip "../../../../build/bitblik-cli-${{ matrix.platform_name }}.zip" .

      - name: Build Linux DEB package
        if: matrix.target == 'linux_x64'
        run: |
          deb_root="build/deb-root"
          rm -rf "$deb_root"
          mkdir -p "$deb_root/DEBIAN" "$deb_root/usr/lib/bitblik" "$deb_root/usr/bin"
          cp -R "build/cli/${{ matrix.target }}/bundle/." "$deb_root/usr/lib/bitblik/"
          ln -s ../lib/bitblik/bin/bitblik "$deb_root/usr/bin/bitblik"
          cat > "$deb_root/DEBIAN/control" <<'EOF'
          Package: bitblik
          Version: 0.0.0~${{ github.run_number }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: bitblik <noreply@github.com>
          Depends: libc6 (>= 2.27)
          Description: BitBlik command line interface
          EOF
          dpkg-deb --build "$deb_root" "build/bitblik-cli-linux-x64.deb"

      - name: Upload CLI tar.gz to release (Unix)
        if: matrix.target != 'windows_x64'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: packages/cli/build/bitblik-cli-${{ matrix.platform_name }}.tar.gz
          asset_name: bitblik-cli-${{ matrix.platform_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload CLI zip to release (Windows)
        if: matrix.target == 'windows_x64'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: packages/cli/build/bitblik-cli-${{ matrix.platform_name }}.zip
          asset_name: bitblik-cli-${{ matrix.platform_name }}.zip
          asset_content_type: application/zip

      - name: Upload Linux DEB to release
        if: matrix.target == 'linux_x64'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: packages/cli/build/bitblik-cli-linux-x64.deb
          asset_name: bitblik-cli-linux-x64.deb
          asset_content_type: application/vnd.debian.binary-package

  # ── 3. Android APK ────────────────────────────────────────────────────────
  build_android:
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_SHA256: ${{ secrets.KEYSTORE_SHA256 }}
        run: flutter build apk --split-per-abi --release

      - name: Upload arm64-v8a APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: packages/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          asset_name: bitblik-app-android-arm64-v8a.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload armeabi-v7a APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: packages/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          asset_name: bitblik-app-android-armeabi-v7a.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload x86_64 APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: packages/app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          asset_name: bitblik-app-android-x86_64.apk
          asset_content_type: application/vnd.android.package-archive

