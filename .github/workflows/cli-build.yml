name: CLI Build Check

on:
  push:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/cli-build.yml'
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/cli-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      # Flutter needed to resolve workspace deps that include Flutter packages
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        working-directory: ./packages/cli
        run: dart analyze --no-fatal-warnings

      # Three declared executables (bitblik = BLIK market, bitway = MB WAY
      # market, bittwint = TWINT market), so each target must be built
      # explicitly.
      - name: Build CLI (all binaries)
        working-directory: ./packages/cli
        run: |
          dart build cli -t bin/bitblik.dart -o build/cli-bitblik
          dart build cli -t bin/bitway.dart -o build/cli-bitway
          dart build cli -t bin/bittwint.dart -o build/cli-bittwint

      # The CLI resolves flow definitions at runtime. A standalone AOT bundle
      # has no package config for `package:bitblik_core/flows/...`, so ship the
      # canonical *.yml beside each executable (FlowFileLoader picks up
      # `flows/` next to the binary).
      - name: Bundle flow definitions
        working-directory: ./packages/cli
        run: |
          for d in bitblik bitway bittwint; do
            mkdir -p "build/cli-$d/bundle/bin/flows"
            cp ../core/lib/flows/*.yml "build/cli-$d/bundle/bin/flows/"
          done
