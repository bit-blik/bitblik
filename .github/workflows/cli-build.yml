name: CLI Build Check

on:
  push:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/cli-build.yml'
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/cli-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/cli
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --no-fatal-warnings

      - name: Build CLI
        run: dart build cli
