name: CLI Build Check

on:
  push:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/cli-build.yml'
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/cli-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      # Flutter needed to resolve workspace deps that include Flutter packages
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        working-directory: ./packages/cli
        run: dart analyze --no-fatal-warnings

      - name: Build CLI
        working-directory: ./packages/cli
        run: dart build cli
