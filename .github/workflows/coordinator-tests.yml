name: Coordinator Tests

on:
  push:
    paths:
      - 'packages/coordinator/**'
      - 'packages/core/**'
      - '.github/workflows/coordinator-tests.yml'
  pull_request:
    paths:
      - 'packages/coordinator/**'
      - 'packages/core/**'
      - '.github/workflows/coordinator-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze --no-fatal-warnings
      - name: Run tests
        run: dart test
        env:
          TERMS_OF_USAGE_NADDR: naddr1dummy_test_value_for_ci
