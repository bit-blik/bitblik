name: Dashboard Docker build & push

on:
  push:
    paths:
      - 'packages/coordinator/dashboard/**'
      # Flow ymls are vendored from packages/core/lib/flows into the image at
      # build time, so changes there must rebuild the dashboard too.
      - 'packages/core/lib/flows/*.yml'
      - '.github/workflows/dashboard-build.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    env:
      REGISTRY: ghcr.io
      IMAGENAME: coordinator-dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        name: Check out code

      # flows/ is gitignored; vendor the flow ymls from packages/core into the
      # build context so the Dockerfile's `COPY flows ./flows` succeeds.
      - name: Sync flow definitions
        run: npm run sync-flows
        working-directory: packages/coordinator/dashboard

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGENAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Dashboard Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./packages/coordinator/dashboard
          file: ./packages/coordinator/dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
