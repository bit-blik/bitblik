name: Telegram Bot Docker build

on:
  push:
    paths:
      - 'packages/telegram_bot/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.dockerignore'
      - '.github/workflows/telegram-bot-build.yml'
  pull_request:
    paths:
      - 'packages/telegram_bot/**'
      - 'packages/core/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.dockerignore'
      - '.github/workflows/telegram-bot-build.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      # Flutter is needed to resolve workspace dependencies that include the
      # BitBlik app package.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        working-directory: ./packages/telegram_bot
        run: dart analyze --no-fatal-warnings

      - name: Run tests
        working-directory: ./packages/telegram_bot
        run: dart test

      - name: Build server executable
        working-directory: ./packages/telegram_bot
        run: dart build cli -t bin/server.dart -o build/server

  build:
    needs: test
    # Pull requests compile the executable above but do not publish an image.
    if: github.event_name != 'pull_request'
    env:
      REGISTRY: ghcr.io
      IMAGENAME: telegram-bot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        name: Check out code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGENAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/telegram_bot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=telegram-bot
          cache-to: type=gha,scope=telegram-bot,mode=max
